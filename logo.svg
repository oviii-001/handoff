<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/> <!-- Vivid Violet -->
      <stop offset="50%" stop-color="#6366F1"/> <!-- Indigo -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Bright Cyan -->
    </linearGradient>
  </defs>
  
  <g fill="none" stroke="url(#brand)">
    <!-- Central Ring -->
    <circle cx="50" cy="50" r="14" stroke-width="12"/>
    
    <!-- Spokes -->
    <g transform="rotate(0, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="rotate(60, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="rotate(120, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="rotate(180, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="rotate(240, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
    <g transform="rotate(300, 50, 50)"><line x1="50" y1="36" x2="50" y2="14" stroke-width="14" stroke-linecap="round"/></g>
  </g>
</svg>
