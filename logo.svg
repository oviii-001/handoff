<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/> <!-- Vivid Violet -->
      <stop offset="50%" stop-color="#6366F1"/> <!-- Indigo -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Bright Cyan -->
    </linearGradient>
  </defs>
  
  <g fill="none" stroke="url(#brand)" stroke-linecap="round">
    <!-- Central Ring -->
    <circle cx="50" cy="50" r="14" stroke-width="12"/>
    
    <!-- Spokes (Calculated absolute coordinates to bypass GitHub's SVG transform sanitization) -->
    <line x1="50" y1="34" x2="50" y2="14" stroke-width="14"/>
    <line x1="63.86" y1="42" x2="81.18" y2="32" stroke-width="14"/>
    <line x1="63.86" y1="58" x2="81.18" y2="68" stroke-width="14"/>
    <line x1="50" y1="66" x2="50" y2="86" stroke-width="14"/>
    <line x1="36.14" y1="58" x2="18.82" y2="68" stroke-width="14"/>
    <line x1="36.14" y1="42" x2="18.82" y2="32" stroke-width="14"/>
  </g>
</svg>
